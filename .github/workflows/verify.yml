# The framework's own gate. `npm run verify` is what every project built from this is told to run
# before a PR (.agents/docs/05-WORKFLOW.md §3); running it here is the framework holding itself to
# the rule it ships.
#
# All three platforms are in the matrix on purpose, not for completeness. Each one breaks this
# framework differently, and every cross-platform defect it has hit was found by running it
# somewhere other than Linux (.agents/docs/DECISIONS.md #19):
#
#   Windows  absolute paths out of globSync, CRLF breaking a byte-for-byte comparison, symlinks
#            refused without developer mode, npm/npx as .cmd shims Node will not spawn directly.
#   macOS    a case-insensitive filesystem by default. The skill mirrors are compared by path and
#            by hash, so anything that assumes `SKILL.md` and `skill.md` are two files is wrong
#            here and right on Linux. Running the whole suite on APFS is the check.
#   Linux    the only one where all of the above are invisible.
#
# A guard that is only ever green on Linux is a guard with a blind spot the size of most of its
# users.
name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  # A run by hand — `gh workflow run verify` or the Actions tab — for when no push has started one.
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No dependencies to install — the CLI and its tests are stdlib-only, which is what makes
      # this job seconds rather than minutes.
      - run: npm run guard
      - run: npm run test

      # The scaffolder is the one thing prose cannot check: it runs create-next-app, merges a
      # package.json, rewrites entry files and wires the agents. Every bug found in it so far was
      # found by running it. --skip-install keeps this to the scaffold, not an npm install.
      - name: scaffold a project and guard it
        shell: bash
        run: |
          node bin/create.mjs "$RUNNER_TEMP/scaffolded" --yes \
            --name="Scaffold Check" --description="Built by CI." --skip-install
          cd "$RUNNER_TEMP/scaffolded"
          node .agents/cli.mjs check
          node .agents/cli.mjs rule 02 7
          # The project gets its own guide and its own CI, never the framework's
          # (.agents/docs/DECISIONS.md #28, #29).
          grep -q "^# Scaffold Check — working guide" AGENTS.md
          git diff --no-index --quiet .github/workflows/verify.yml .agents/kit/ci/verify.yml
          test -d .git

  # The README's promise is a repository where `npm run verify` works. The job above scaffolds with
  # --skip-install, so it never runs typecheck, lint or vitest against what the scaffolder wrote —
  # this one does, once, on Linux: the dependency set is the same on every platform, and the
  # platform-specific breakage is the job above's to find.
  scaffold-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The apostrophe and the braces are the test: written into JSX as text, either one failed
      # the project's own lint or typecheck on its first run (.agents/docs/DECISIONS.md #32).
      - name: scaffold a project, install it, and run its own gate
        run: |
          node bin/create.mjs "$RUNNER_TEMP/installed" --yes \
            --name "Install Check's {App}" --description="Built by CI."
          cd "$RUNNER_TEMP/installed"
          npm run verify
          test "$(git config core.hooksPath)" = ".agents/kit/hooks"
      # The code templates are what an agent copies verbatim; nothing else ever runs them.
      - name: type-check and lint the code templates inside that scaffold
        run: node bin/check-templates.mjs "$RUNNER_TEMP/installed"
      # The import firewall is a lint config, and a config nothing feeds a bad import to has side
      # doors nobody sees (.agents/docs/DECISIONS.md #35). Every zone, both ways.
      - name: prove every lint zone refuses and allows what the rulebook says
        run: node bin/check-lint.mjs "$RUNNER_TEMP/installed"

  # The checks need Node 22.2. On anything older they must say so, `hooks` (the postinstall) must
  # not fail `npm install`, and the scaffolder must refuse before writing a file.
  old-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # `if`, not `!`: bash -e never fails a step on a negated command, so `! cmd` asserts nothing.
      - name: refuse clearly, and leave install alone
        run: |
          if node .agents/cli.mjs check 2> err.txt; then echo "check ran on Node 20"; exit 1; fi
          grep -q "needs Node 22.2 or newer" err.txt
          node .agents/cli.mjs rule 02 7 > /dev/null
          node .agents/cli.mjs hooks
          if node bin/create.mjs "$RUNNER_TEMP/old" --yes; then echo "create ran on Node 20"; exit 1; fi
          test ! -e "$RUNNER_TEMP/old"
